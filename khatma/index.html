@font-face{font-family:'warsh';src:url('warsh.woff2') format('woff2');font-display:block}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:18px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.15;color:var(--accent)}
h2{font-size:15px;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.kname{font-weight:600}
.kmeta{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:grid;gap:12px}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px}
.ring{width:150px;height:150px;flex:none;margin-inline:auto}
.ring path{fill:none;stroke-width:15;stroke:var(--track)}
.ring path.d{stroke:var(--accent)}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}
.herotext{flex:1 1 180px;display:grid;gap:6px}
.big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.25;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.late{color:var(--late)} .pill.fin{color:var(--gold)} .pill.idle{color:var(--muted)}
.ayah{font-family:var(--mushaf);font-size:26px;line-height:2;color:var(--gold);text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 42% var(--tile-l));flex:none}
.rows{display:grid}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.rank{width:22px;text-align:center;color:var(--muted);font-weight:600;flex:none}
.grow{flex:1 1 70px;min-width:0}
.sub{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;flex:1 1 100%}
.bar i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 42% var(--tile-l))}
.next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tile{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:transparent;display:grid;place-content:center;padding:0;color:var(--ink);font-size:17px;font-weight:600}
.tile.d{background:hsl(var(--h) 42% var(--tile-l));border-color:transparent;color:var(--tile-ink)}
.tile.nx{border-color:var(--gold)}
.form{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:6px 12px;flex:1 1 140px;min-width:0}
label{font-size:14px;color:var(--muted);display:grid;gap:4px;flex:1 1 140px}
.foot{color:var(--muted);font-size:13px;text-align:center}
.scrim{position:fixed;inset:0;background:rgba(6,16,14,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:5}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:90%;overflow:auto;display:grid;gap:12px}
.sheet h3{font-family:var(--display);font-size:26px;color:var(--accent)}
.msg{background:var(--bg);border-radius:10px;padding:12px;font-size:15px}
/* reader */
.rbar{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line)}
.rbar div{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.rbar .t{flex:1;font-weight:600;text-align:center}
.read{max-width:640px;margin:0 auto;padding:16px 18px 56px;display:grid;gap:18px}
.q{font-family:var(--mushaf);font-size:var(--fs,26px);line-height:2.15;text-align:justify;word-spacing:.06em}
.sura{font-family:var(--mushaf);text-align:center;font-size:calc(var(--fs,26px) * 1.05);border-block:1px solid var(--gold);color:var(--gold);padding:4px 0;line-height:1.9}
.cont{text-align:center;color:var(--muted);font-size:14px}
.bsm{font-family:var(--mushaf);font-size:var(--fs,26px);text-align:center;line-height:2}
.pgm{font-family:var(--body);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin:0 6px;vertical-align:middle;white-space:nowrap}
.src{color:var(--muted);font-size:12px;text-align:center}
.tg{color:var(--tj-g)}.tq{color:var(--tj-q)}.tm{color:var(--tj-m)}.tk{color:var(--tj-k)}.ti{color:var(--tj-i)}.tx{color:var(--tj-x)}.tl{color:var(--tj-l)}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted);padding:10px 14px}
.leg .k{font-weight:600}.leg .k::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-inline-end:5px}
.leg .btn{margin-inline-start:auto}.leg .w{flex-basis:100%}
.mw{cursor:pointer;text-decoration:underline dotted var(--muted);text-decoration-thickness:1.5px;text-underline-offset:.5em}
.sheet .mq{font-family:var(--mushaf);font-size:28px;line-height:2;text-align:center}
.msg b{color:var(--accent)}
@media (min-width:600px){.scrim{align-items:center}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}.sheet{animation:up .22s ease}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
.wide{width:100%}
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;font-size:15px}
.lnk{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:13px}
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;min-height:52px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .sub{margin-inline-start:auto;text-align:end}
details.card>summary::after{content:'';width:8px;height:8px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none}
details.card[open]>summary::after{transform:rotate(-45deg)}
.dbody{padding:0 16px 16px}
.wbar{position:sticky;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line)}
.wbar div{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.pgm{cursor:pointer}.pgm,.sura{scroll-margin-top:64px}
.sidx{display:grid}
.srow{display:flex;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;min-height:44px;text-align:start}

function tj(t,marks,color,key){
  var MK='ً-ٰٟ۟-۪ۤۧۨ-ۭ';
  var re=new RegExp('([^'+MK+'])(['+MK+']*)','g'),c=[],x,i,j,k,b,m,p,q,o='',e;
  while((x=re.exec(t)))c.push({b:x[1],m:x[2],w:'',s:'',k:-1});
  function has(s,ch){return s.indexOf(ch)>=0}
  function nx(i){for(var j=i+1;j<c.length;j++)if(/[ء-يے]/.test(c[j].b))return j;return -1}
  function sp(i,j){for(var q=i+1;q<j;q++)if(c[q].b===' ')return true;return false}
  function rule(i,j){
    var n=c[j].b;
    if(has('ينمو',n)){if(!sp(i,j))return '';if((n==='ي'||n==='و')&&!c[j].w)c[j].w='tg';return 'tx'}
    if(n==='ل'||n==='ر')return sp(i,j)?'tx':'';
    if(has('صذثكجشقسدطزفتضظ',n))return 'tk';
    return '';
  }
  for(i=0;i<c.length;i++){
    e=c[i];b=e.b;m=e.m;
    if(has(m,'ٓ')&&b!=='أ'&&!/[ۖ-ۜ]/.test(b)){
      k=m.indexOf('ٰ');
      if(k>=0&&k<m.indexOf('ٓ')){e.s='tm';e.k=k}else e.w='tm';
      continue;
    }
    if((b==='ن'||b==='م')&&has(m,'ّ'))e.w='tg';
    else if(has('قطبجد',b)&&has(m,'ْ')){j=nx(i);if(!(j>=0&&has(c[j].m,'ّ')))e.w='tq'}
    else if(b==='ل'&&has(m,'َ')&&!has(m,'۪')&&i>0){
      p=c[i-1];q=c[i+1];
      if(has('صطظ',p.b)&&(has(p.m,'َ')||has(p.m,'ْ'))&&!has(p.m,'ٰ')&&!(q&&(/[ىے]/.test(q.b)||(q.b==='ي'&&has(q.m,'ٰ')))))e.w='tl';
    }
    else if(b==='ن'&&(m===''||m==='ۢ')){j=nx(i);if(j>=0){if(m){if(c[j].b==='ب')e.w='ti'}else if(!e.w)e.w=rule(i,j)}}
    else if(b==='ن'&&m==='ْ'){j=nx(i);if(j>=0&&(c[j].b==='ي'||c[j].b==='و')&&sp(i,j)&&has(c[j].m,'ّ')){e.w='tx';if(!c[j].w)c[j].w='tg'}}
    else if(b==='م'&&m===''){j=nx(i);if(j>=0){if(c[j].b==='ب')e.w='tk';else if(c[j].b==='م'&&sp(i,j))e.w='tx'}}
    k=m.search(/[ً-ٍٖٗٞ]/);
    if(k>=0&&(has(m,'ۢ')||/[ٖٗٞ]/.test(m))){
      j=nx(i);
      if(j>=0){p=has(m,'ۢ')?(c[j].b==='ب'?'ti':''):rule(i,j);if(p){e.s=p;e.k=k}}
    }
  }
  for(i=c.length-1;i>=0;i--)if(/[ء-يے]/.test(c[i].b)){if(has('قطبجد',c[i].b)&&!c[i].w)c[i].w='tq';break}
  function S(k,s){return k&&color?'<span class="'+k+'">'+esc(s)+'</span>':esc(s)}
  var wi=-1,inW=false,op=-1,mi=0;
  for(i=0;i<c.length;i++){
    e=c[i];
    if(e.b===' '){if(inW){inW=false;if(op>=0&&wi>=marks[op][1]){o+='</span>';op=-1}}o+=' ';continue}
    if(e.b==='\u00A0'&&op>=0){o+='</span>';op=-1}
    if(!inW){
      inW=true;wi++;
      if(op<0&&marks){
        while(mi<marks.length&&marks[mi][1]<wi)mi++;
        if(mi<marks.length&&marks[mi][0]<=wi){op=mi;o+='<span class="mw" data-act="open" data-v="mean:'+key+':'+mi+'">';mi++}
      }
    }
    o+=e.k>=0?S(e.w,e.b+e.m.slice(0,e.k))+S(e.s,e.m.slice(e.k)):S(e.w,e.b+e.m);
  }
  if(op>=0)o+='</span>';
  return o;
}

}
function render(){
  if(reading){var y0=window.scrollY;root.innerHTML=vReader()+vSheet();window.scrollTo(0,y0);return}
  root.innerHTML='<div class="wrap"><header class="top"><h1>ختمة العائلة</h1><div class="kmeta">'+esc(S.khatma.name)+'</div></header>'+
    vWird()+vQuick()+vRace()+vJuz()+vAdmin()+
    '<p class="foot">'+(code&&CFG.db?(online?'متصل: تُحفظ قراءتك لكل العائلة.':'غير متصل الآن: تُحفظ قراءتك هنا وتُرسل عند عودة الاتصال.'):'لم يُربط هذا الهاتف بختمة العائلة بعد. افتح الرابط الذي وصلك.')+'</p></div>'+vSheet();
}
function land(){
  var t=want,el=null,g;
  if(!t){window.scrollTo(0,0);return}
  if(t.y!=null){window.scrollTo(0,t.y);return}
  if(t.s)el=document.getElementById('s'+t.s);
  else for(g=t.pg;g>0&&!el;g--)el=document.getElementById('p'+g);
  if(el)el.scrollIntoView({block:'start'});else window.scrollTo(0,0);
}
function openJuz(n,t){
  reading=n;sheet=null;loadMean(n);want=t||(pos&&pos.n===n?{y:pos.y}:null);
  if(JD[n]){render();land();return}
  loadErr=0;render();window.scrollTo(0,0);
  var s=document.createElement('script');s.src='juz/'+(n<10?'0':'')+n+'.js';
  s.onerror=function(){loadErr=n;if(reading===n)render()};
  document.head.appendChild(s);
}
function goPage(pg){pg=Math.max(1,Math.min(LAST,pg||1));openJuz(juzOf(pg),{pg:pg})}
function loadMean(n){
  if(MD[n]||ML[n])return;ML[n]=1;
  var s=document.createElement('script');s.src='m/'+(n<10?'0':'')+n+'.js';s.onerror=function(){ML[n]=0};
  document.head.appendChild(s);
}
window.__mean=function(n,d){MD[n]=d;if(reading===n&&JD[n])render()};
window.__juz=function(n,d){JD[n]=d;if(reading===n){render();land()}};
var st=0;
window.addEventListener('scroll',function(){
  if(!reading||!JD[reading])return;
  clearTimeout(st);st=setTimeout(function(){if(!reading)return;pos={n:reading,y:Math.round(window.scrollY)};try{localStorage.setItem('kf_pos',JSON.stringify(pos))}catch(e){}},400);
},{passive:true});
root.addEventListener('toggle',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-sec');if(k)sec[k]=e.target.open},true);

root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||!root.contains(el))return;
  var act=el.getAttribute('data-act'),v=el.getAttribute('data-v'),m;
  if(act==='close'){if(el.classList.contains('scrim')&&e.target!==el)return;sheet=null;copied=false;render();return}
  if(act==='open'){sheet=v;copied=false;render();return}
  if(act==='me'){me=v||null;try{me?localStorage.setItem('kf_me',me):localStorage.removeItem('kf_me')}catch(_){}render();return}
  if(act==='read'){openJuz(+v);return}
  if(act==='wird'){m=mem(me);if(m)goPage(m.p+1);return}
  if(act==='resume'){if(pos&&pos.n)openJuz(pos.n);return}
  if(act==='goto'){goPage(+v);return}
  if(act==='sura'){openJuz(Q.si[+v-1][0],{s:+v});return}
  if(act==='back'){reading=0;sheet=null;render();window.scrollTo(0,0);return}
  if(act==='fs'){fs=Math.max(18,Math.min(44,fs+ +v));try{localStorage.setItem('kf_fs',fs)}catch(_){}render();return}
  if(act==='tj'){tjOn=!tjOn;try{localStorage.setItem('kf_tj',tjOn?'1':'0')}catch(_){}render();return}
  if(act==='setp'){m=mem(me);if(m){m.p=Math.max(0,Math.min(LAST,+v));sheet=null;save()}return}
  if(act==='bm'){bm=+v;try{localStorage.setItem('kf_bm',bm)}catch(_){}sheet=null;render();return}
  if(act==='finish'){m=mem(me);if(m)m.p=Math.max(m.p,Q.meta[+v-1][1]);reading=0;save();window.scrollTo(0,0);return}
  if(act==='delm'){S.members=S.members.filter(function(x){return x.id!==v});if(me===v)me=null;sheet=null;save();return}
  if(act==='dl'){if(dl<=0)dlAll();return}
  if(act==='copy'){
    var txt=document.getElementById('msgText').textContent;
    try{navigator.clipboard.writeText(txt).then(function(){copied=true;render()},function(){})}catch(_){}
    return;
  }
});
root.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.getAttribute('data-form');
  if(f==='addm'){
    var name=document.getElementById('newMember').value.trim();if(!name)return;
    S.members.push({id:'m'+Date.now().toString(36),name:name,p:0});save();
  }else if(f==='renm'){
    var rn=document.getElementById('renName').value.trim(),rm=mem(e.target.getAttribute('data-v'));
    if(!rn||!rm)return;rm.name=rn;sheet=null;save();
  }else if(f==='gopg'){
    var g=parseInt(document.getElementById('goPage').value,10);if(g>=1&&g<=LAST)goPage(g);
  }else if(f==='newk'){
    S.khatma={name:document.getElementById('kName').value.trim()||'ختمة العائلة',start:document.getElementById('kStart').value||iso(today()),days:+document.getElementById('kDays').value};
    S.members.forEach(function(m){m.p=0});sheet=null;save();
  }
});

migrate();render();sync();
setInterval(function(){if(!document.hidden)sync()},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
window.addEventListener('online',sync);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script></body></html>
