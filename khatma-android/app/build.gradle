plugins {
    id 'com.android.application'
}

// Trusted Web Activity shell around https://tiloucloud.github.io/khatma/
// The web app itself lives in /khatma; this project only wraps it for Google Play.
def ksPath = System.getenv('KS_PATH')
def ksPass = System.getenv('KS_PASS')
def buildNumber = (System.getenv('BUILD_NUMBER') ?: '1') as int

android {
    namespace 'com.tiloucloud.khatma'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tiloucloud.khatma'
        minSdk 21
        targetSdk 36
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias 'khatma'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
