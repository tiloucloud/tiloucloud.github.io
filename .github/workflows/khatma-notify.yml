name: Khatma notifications

on:
  schedule:
    - cron: '0 7 * * *'   # morning message, 07:00 UTC
    - cron: '0 19 * * *'  # evening reminder, 19:00 UTC
  workflow_dispatch:
    inputs:
      slot:
        description: 'am = morning message, pm = evening reminder'
        required: true
        default: 'am'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: khatma-push
        run: npm install --no-audit --no-fund
      - name: Send
        working-directory: khatma-push
        env:
          DB: https://khatma-16d1b-default-rtdb.firebaseio.com
          SITE: https://tiloucloud.github.io/khatma/
          VAPID_PUBLIC: BK9pSZwhnJPm5ignUy7GkbfL49n9_lZbgnHEq6K5TeOaT5zDzkJp5RF0DbjShH-zWK-lDdx2SqQjcBrLsHDPNQc
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          KHATMA_CODE: ${{ secrets.KHATMA_CODE }}
          SLOT: ${{ github.event.inputs.slot || (github.event.schedule == '0 7 * * *' && 'am' || 'pm') }}
        run: node send.js
