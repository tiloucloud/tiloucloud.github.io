name: Khatma notifications

on:
  schedule:
    - cron: '41 6 * * *'   # morning message, ~06:41 UTC (off the busy top of the hour)
    - cron: '37 18 * * *'  # evening reminder, ~18:37 UTC
    - cron: '13 7 * * 5'   # Friday: Surat al-Kahf, ~07:13 UTC
    - cron: '7 21 * * *'   # nightly: al-Mulk and al-Waqi'a before sleep, ~21:07 UTC
    - cron: '19,49 7-21 * * *'  # family council: new focus sessions and comments, every 30 min in daytime
  workflow_dispatch:
    inputs:
      slot:
        description: 'am = morning message, pm = evening reminder, kahf = Friday Kahf, night = Mulk and Waqi''a, fs = family council'
        required: true
        default: 'am'
      dry:
        description: 'yes = only print what would be sent'
        required: false
        default: 'no'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        working-directory: khatma-push
        run: npm install --no-audit --no-fund
      - name: Send
        working-directory: khatma-push
        env:
          DB: https://khatma-16d1b-default-rtdb.firebaseio.com
          SITE: https://tiloucloud.github.io/khatma/
          VAPID_PUBLIC: BK9pSZwhnJPm5ignUy7GkbfL49n9_lZbgnHEq6K5TeOaT5zDzkJp5RF0DbjShH-zWK-lDdx2SqQjcBrLsHDPNQc
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          KHATMA_CODE: ${{ secrets.KHATMA_CODE }}
          DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
          SLOT: ${{ github.event.inputs.slot || (github.event.schedule == '41 6 * * *' && 'am') || (github.event.schedule == '13 7 * * 5' && 'kahf') || (github.event.schedule == '7 21 * * *' && 'night') || (github.event.schedule == '19,49 7-21 * * *' && 'fs') || 'pm' }}
          DRY_RUN: ${{ github.event.inputs.dry == 'yes' && '1' || '' }}
        run: node send.js
