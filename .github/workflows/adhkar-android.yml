name: Adhkar Android app

# Builds the signed Google Play bundle (.aab) and an installable .apk,
# then publishes both at https://tiloucloud.github.io/adhkar/app/
on:
  push:
    branches: [main]
    paths: ['adhkar-android/**', '.github/workflows/adhkar-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adhkar-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::Signing secrets are missing: building an unsigned test build only."
            echo "UNSIGNED=1" >> "$GITHUB_ENV"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KS_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: adhkar-android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Check signature
        if: env.UNSIGNED != '1'
        run: |
          APK=$(ls adhkar-android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i "SHA-256"

      - name: Stop here without signing keys
        if: env.UNSIGNED == '1'
        run: |
          ls -la adhkar-android/app/build/outputs/bundle/release/ adhkar-android/app/build/outputs/apk/release/
          echo "::error::The project builds. Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets to get a signed app."
          exit 1

      - name: Publish files to the site
        run: |
          mkdir -p adhkar/app
          cp adhkar-android/app/build/outputs/bundle/release/app-release.aab adhkar/app/adhkar-family.aab
          cp $(ls adhkar-android/app/build/outputs/apk/release/*.apk | head -1) adhkar/app/adhkar-family.apk
          echo "{\"version\":\"1.0.${{ github.run_number }}\",\"code\":${{ github.run_number }},\"built\":\"$(date -u +%FT%TZ)\"}" > adhkar/app/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adhkar/app
          git commit -m "Android build 1.0.${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main
