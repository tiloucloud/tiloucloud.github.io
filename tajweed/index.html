p{margin:6px 0 10px}
.muted{color:var(--muted)}

.sec::after{content:"";flex:1;height:2px;background:linear-gradient(to left,var(--gold-l),transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}

.mushaf{background:var(--paper);color:var(--ink);border:3px double var(--gold);border-radius:18px;margin:14px auto 0;padding:16px 34px;text-align:center;max-width:560px;position:relative}

.welcome .btn{max-width:320px}
.field{background:var(--surface);color:var(--ink);border-color:var(--line);width:100%}

.lbr{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}

.lbr .pt{font:700 17px var(--display);color:var(--emerald-2);white-space:nowrap}
.pick{display:grid;gap:8px}
.pick button{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2>*{flex:1}
/* toast & sheet */
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));translate:-50% 0;z-index:30;background:var(--emerald);color:#fff;border:2px solid var(--gold-l);padding:10px 18px;border-radius:16px;font-weight:700;box-shadow:0 10px 30px #0006;max-width:90vw;text-align:center;animation:pop .35s ease}

.sheet{position:fixed;inset:0;z-index:25;background:#0008;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:min(720px,100%);border-radius:22px 22px 0 0;padding:18px max(4vw,16px) calc(20px + env(safe-area-inset-bottom));max-height:85svh;overflow:auto}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

.ver{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
@media(prefers-reduced-motion:reduce){.star,.toast{animation:none}.meter i{transition:none}}

  '<li><button data-a="quiz"><span class="dot"></span>التمرين'+(S.q?'<span class="ok">'+S.q+'/'+QUIZ.length+'</span>':'')+'</button></li></ul>';

function vLesson(){
 var p=PAGES[st.p],k=p.k,h='';
 var step='<p class="step">الدرس الأول · '+(st.p+1)+' من '+PAGES.length+'</p>';
 if(k==='intro'){
  h='<div class="band zel"><h2>ما النون الساكنة والتنوين؟</h2><div class="mushaf"><p class="ayah">عَلِيمٌ = عَلِيمُ<span class="hl c-iz">نْ</span></p><div class="src">التنوين يُنطق نوناً ساكنة</div></div></div>'+step+'<p class="center">'+listenBtn()+'</p>'+
  '<p><b>النون الساكنة</b> نونٌ عليها سكون، مثل «مِنْ» و«أَنْعَمْتَ».</p><p><b>التنوين</b> نونٌ ساكنة تُنطق في نهاية الكلمة ولا تُكتب، وعلامته حركتان: ـً ـٍ ـٌ.</p>'+
  '<div class="note"><b>القاعدة الذهبية:</b> الحرف الذي يأتي <b>بعد</b> النون هو الذي يحدّد كيف ننطقها. لذلك نتعلّم حروف كل واحد من هذه الأحكام.</div>';
  cur='النون الساكنة نون عليها سكون. والتنوين نون ساكنة تنطق في آخر الاسم ولا تكتب. والقاعدة الذهبية: الحرف الذي يأتي بعد النون هو الذي يحدد كيف ننطقها.';
 }else if(k==='sum'){
  h='<div class="band zel"><h2>الخلاصة</h2><p>انظر إلى الحرف بعد النون الساكنة أو التنوين</p></div>'+step+'<p class="center">'+listenBtn()+'</p>'+
  ORDER.map(function(x){return '<div class="sumrow c-'+x+'"><b>'+R[x].n+'</b><div class="letters">'+R[x].L.map(function(l){return lt(l,1)}).join('')+'</div></div>'}).join('')+
  '<p class="tip" style="margin-top:12px">والآن جرّب نفسك في تمرين من '+QUIZ.length+' سؤالاً</p>';
  cur='الخلاصة: انظر إلى الحرف بعد النون الساكنة أو التنوين.';
 }else{
  var r=R[k],L=LESSON[k],m=L.memo;

  '<div class="sec"><h3>حروفه</h3></div><div class="letters c-'+k+'">'+r.L.map(function(l){return lt(l)}).join('')+'</div><p class="tip">المس الحرف لتسمع اسمه</p>'+
  (m?'<div class="memo c-'+k+'">'+(m.w?'<div class="w">'+m.w+'</div>':'')+(m.s?'<div class="s">'+m.s+'</div>':'')+'<small>'+m.t+'</small></div>':'')+
  '<div class="sec"><h3>أمثلة</h3></div><p class="tip">المس المثال لترى السبب وتسمعه</p>'+
  L.ex.map(function(e,j){return '<div class="ex c-'+k+'" role="button" tabindex="0" data-a="ex" data-v="e'+(OFF[k]+j)+'" data-say="'+esc(e[2]+'، إذن: '+r.n)+'"><p class="ayah">'+mark(e[0],k)+'</p><div class="exf">'+(e[1]?'<span class="src">سورة '+e[1]+'</span>':'')+(e[3]?'<button class="rec" data-a="rec" data-v="'+e[3]+'">'+svg('<path d="M8 5v14l11-7z" fill="currentColor"/>')+'تلاوة الآية</button>':'')+'</div><div class="why">'+e[2]+' ← <b style="color:var(--c)">'+r.n+'</b></div></div>'}).join('')+
  (L.note?'<div class="note">'+L.note+'</div>':'');
  cur=r.n+'. '+r.s+'. '+L.why;
 }
 curKey='p'+st.p;
 app.innerHTML=h;
 setBar('<button class="btn ghost" data-a="prev">'+(st.p?'السابق':'الفهرس')+'</button><button class="btn" data-a="next">'+(k==='sum'?'ابدأ التمرين':'التالي')+'</button>');
}
function vQuiz(){
 var it=st.qs[st.qi],t=it[0],k=it[1],w=it[2],p=st.pick;
 app.innerHTML='<div class="qhead zel"><div class="meter" style="margin-top:0"><i style="width:'+((st.qi+(p?1:0))/st.qs.length*100)+'%"></i></div>السؤال '+(st.qi+1)+' من '+st.qs.length+': ما حكم الموضع المسطَّر؟'+
 '<div class="mushaf"><p class="ayah">'+t.replace('⟨','<span style="text-decoration:underline 3px var(--gold);text-underline-offset:12px">').replace('⟩','</span>')+'</p></div></div>'+
 '<div class="opts">'+ORDER.map(function(o){return '<button class="opt c-'+o+' '+(p?(o===k?'ok':o===p?'no':''):'')+'" data-a="pick" data-v="'+o+'"'+(p?' disabled':'')+'>'+R[o].n+'</button>'}).join('')+'</div>'+
 (p?'<div class="fb c-'+k+'"><div class="h '+(p===k?'y">'+st.cheer:'n">ليست هذه، الصواب: '+R[k].n)+'</div><span class="why2"><b>التعليل:</b> '+w+' فالحكم: <b style="color:var(--c)">'+R[k].n+'</b>.</span></div>':'');
 setBar(p?'<button class="btn" data-a="qn">'+(st.qi+1<st.qs.length?'السؤال التالي':'النتيجة')+'</button>':'<button class="btn ghost" data-a="nav-idx">الفهرس</button>');
}
function vResult(){
 var n=st.qs.length,s=st.score,msg=s===n?'ما شاء الله، علامة كاملة!':s>=n*.7?'أحسنت، بقي القليل':'بداية طيبة، والمراجعة تثبّت الأحكام';
 app.innerHTML='<div class="ring" style="--p:'+(s/n*100)+'"><div>'+s+'/'+n+'</div></div><h2 class="center">'+msg+'</h2><p class="center muted">مجموع نقاطك: <b style="color:var(--gold)">'+points()+'</b></p>'+
 (st.wrong.length?'<div class="sec"><h3>مواضع للمراجعة</h3></div>'+st.wrong.map(function(x){return '<div class="ex open c-'+x[1]+'"><p class="ayah">'+mark(x[0],x[1])+'</p><div class="why"><b>التعليل:</b> '+x[2]+' فالحكم: <b style="color:var(--c)">'+R[x[1]].n+'</b>.</div></div>'}).join(''):'');
 setBar('<button class="btn ghost" data-a="nav-fam">التحدي</button>'+(st.wrong.length?'<button class="btn" data-a="retry">أعد الأخطاء</button>':'<button class="btn" data-a="quiz">تمرين جديد</button>'));
}
/* family */
var LB=[],MEM=[],famMsg='';
function fget(path){return fetch(DB+'/k/'+F.code+path+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function fput(path,v){return fetch(DB+'/k/'+F.code+path+'.json',{method:'PUT',body:JSON.stringify(v)}).then(function(r){if(!r.ok)throw r.status})}
var pt=null;function pushSoon(){if(!F.code||!F.me)return;clearTimeout(pt);pt=setTimeout(function(){fput('/tj/p/'+F.me,{n:S.name||'',pts:points(),pg:pagesDone(),q:S.q,b:Object.keys(earned()).filter(function(x){return x!=='b5'}),at:Date.now()}).catch(function(){})},800)}
function loadFam(){if(!F.code)return Promise.resolve();return Promise.all([fget('/members').catch(function(){return null}),fget('/tj/m').catch(function(){return null}),fget('/tj/p').catch(function(){return null})]).then(function(r){
 var ms=[],id;for(id in(r[0]||{}))if(r[0][id]&&r[0][id].name)ms.push({id:id,name:r[0][id].name});for(id in(r[1]||{}))if(r[1][id]&&r[1][id].name&&!ms.some(function(m){return m.id===id}))ms.push({id:id,name:r[1][id].name});
 MEM=ms;var p=r[2]||{};LB=ms.map(function(m){var x=p[m.id]||{};return{id:m.id,name:m.name,pts:+x.pts||0,b:x.b||[]}}).sort(function(a,b){return b.pts-a.pts});famMsg='';
}).catch(function(){famMsg='تعذّر الاتصال، تحقّق من الإنترنت.'})}
function link(){return location.origin+location.pathname+'#k='+F.code}
function vFam(){
 var e=earned();
 var bd='<div class="sec"><h3>أوسمتي</h3></div><div class="badges">'+BADGES.map(function(b){return '<div class="bd'+(e[b.id]?'':' off')+'"><i>'+b.i+'</i><b>'+b.t+'</b><br><span class="muted">'+b.d+'</span></div>'}).join('')+'</div>';
 var h='<div class="band zel"><h2>تحدّي العائلة</h2><p>تعلّموا معاً، واجمعوا النقاط والأوسمة، وشجّعوا بعضكم.</p><p style="font:700 22px var(--display);color:var(--gold-l);margin-top:8px">نقاطك: '+npts(points())+'</p></div>';
 if(!F.code){
  h+='<div class="card"><h3>ابدأ تحدّياً عائلياً</h3><p class="muted">أنشئ تحدّياً وأرسل الرابط لأهلك على واتساب.</p>'+
  '<input class="field" id="fn" maxlength="24" placeholder="اسمك" value="'+esc(S.name||'')+'"><button class="btn" data-a="fcreate">أنشئ التحدي</button></div><div class="card"><h3>عائلتك في «ختمة العائلة»؟</h3><p class="muted">الصق رابط ختمة العائلة هنا لتنضمّ إلى المجموعة نفسها.</p><input class="field" id="fl" dir="ltr" placeholder="رابط الختمة"><button class="btn sec2" data-a="fjoin">انضمّ</button></div>';
 }else if(!F.me){
  h+='<div class="card"><h3>من أنت؟</h3><p class="muted">اختر اسمك من أفراد العائلة.</p><div class="pick">'+MEM.map(function(m){return '<button data-a="fme" data-v="'+esc(m.id)+'">'+esc(m.name)+'</button>'}).join('')+'</div>'+
  '<p class="muted" style="margin-top:12px">اسمك غير موجود؟</p><input class="field" id="fn" maxlength="24" placeholder="اسمك" value="'+esc(S.name||'')+'"><button class="btn sec2" data-a="fadd">أضفني</button></div>';
 }else{
  var top=LB[0],meR=LB.findIndex(function(x){return x.id===F.me});
  var cheer=meR===0&&top&&top.pts>0?'أنت في الصدارة، ما شاء الله! واصل.':meR>0?'بينك وبين '+esc(LB[meR-1].name)+' '+(LB[meR-1].pts-LB[meR].pts)+' نقطة، تستطيع اللحاق!':'ابدأ الدرس لتجمع أول نقاطك.';
  h+='<div class="card center"><b style="font:700 18px var(--display);color:var(--emerald-2)">'+cheer+'</b></div><div class="sec"><h3>ترتيب العائلة</h3></div><div class="lb">'+LB.map(function(x,i){return '<div class="lbr'+(x.id===F.me?' me':'')+'"><span class="rk">'+(i<3&&x.pts>0?['🥇','🥈','🥉'][i]:(i+1))+'</span><span class="nm">'+esc(x.name)+'</span><span class="muted" style="font-size:13px">'+(x.b.length?x.b.length+' أوسمة':'')+'</span><span class="pt">'+x.pts+'</span></div>'}).join('')+'</div>'+
  '<div class="row2" style="margin-top:12px"><a class="btn" style="text-decoration:none" href="https://wa.me/?text='+encodeURIComponent('السلام عليكم 🌿\nانضمّوا إلى تحدّي تجويد العائلة، نتعلّم أحكام التجويد برواية ورش ونتنافس معاً 🤍\n'+link())+'" target="_blank" rel="noopener">دعوة الأهل على واتساب</a><button class="btn sec2" data-a="fcopy">نسخ الرابط</button></div>';
 }
 if(famMsg)h+='<p class="tip">'+famMsg+'</p>';
 app.innerHTML=h+bd;setBar('');
}
function vSettings(){
 var d=document.createElement('div');d.className='sheet';d.innerHTML='<div><h3>الإعدادات</h3>'+
 '<div class="srow"><span>حجم خط الآيات</span><span class="row2"><button class="sz" data-a="fz" data-v="-4">أ−</button><button class="sz" data-a="fz" data-v="4">أ+</button></span></div>'+
 '<div class="srow"><span>الصوت</span><button class="sz" data-a="snd" style="padding:0 14px">'+(snd?'مُشغّل':'متوقّف')+'</button></div>'+
 '<div class="srow"><span>اسمك</span><input class="field" id="sn" style="max-width:180px;margin:0;min-height:44px" maxlength="24" value="'+esc(S.name||'')+'"></div>'+
 (F.code?'<div class="srow"><span>تحدّي العائلة</span><button class="sz" data-a="fleave" style="padding:0 14px">مغادرة</button></div>':'')+
 '<p class="ver">الإصدار '+V+' · Galaxy Adventure Studio</p><button class="btn" data-a="sclose">تم</button></div>';
 document.body.appendChild(d);
}
function render(){stop();document.body.classList.toggle('w',st.v==='welcome');
 var navOn={home:'home',index:'idx',lesson:'idx',quiz:'idx',result:'idx',fam:'fam'}[st.v];setNav(navOn);
 ({welcome:vWelcome,home:vHome,index:vIndex,lesson:vLesson,quiz:vQuiz,result:vResult,fam:vFam})[st.v]();centerLetters();window.scrollTo(0,0)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){centerLetters()});
function go(v){st.v=v;if(v==='fam'){render();loadFam().then(function(){if(st.v==='fam'){checkBadges();vFam()}})}else render()}
function startQuiz(list){var a=list.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}st.qs=a;st.qi=0;st.pick=null;st.score=0;st.wrong=[];go('quiz')}

/* family link in URL */
var hk=(location.hash.match(/[#&]k=([A-Za-z0-9_-]{8,64})/)||[])[1];
if(hk&&hk!==F.code){F={code:hk};ls('tj_f',F)}
if(location.hash)history.replaceState(null,'',location.pathname);

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a],[data-l]');if(!b)return;
 if(b.dataset.l){var i=LK.indexOf(b.dataset.l);playSeq(['l'+i],null,LN[b.dataset.l]);return}
 var a=b.dataset.a,v=b.dataset.v;
 if(a==='enter'){var nm=document.getElementById('nm');if(nm&&nm.value.trim()){S.name=nm.value.trim();save()}touchDay();save();go(F.code&&!F.me?'fam':'home');return}
 if(a.indexOf('nav-')===0){var t=a.slice(4);if(t==='set'){vSettings();return}go({home:'home',idx:'index',fam:'fam'}[t]);return}
 if(a==='listen'){if(b.classList.contains('on')){stop();return}playSeq([curKey],b,cur);return}
 if(a==='rec'){var was=b.classList.contains('on');stop();document.querySelectorAll('.rec.on').forEach(function(x){x.classList.remove('on')});if(was)return;var au=new Audio(RECIT+v+'.mp3');player=au;b.classList.add('on');au.onended=au.onerror=function(){b.classList.remove('on')};au.play().catch(function(){b.classList.remove('on');toast('تعذّر تشغيل التلاوة، تحقّق من الإنترنت')});return}
 if(a==='ex'){b.classList.toggle('open');if(b.classList.contains('open'))playSeq([v],null,b.dataset.say);return}
 if(a==='start'){var f=0;while(f<PAGES.length-1&&S.pg[f])f++;st.p=f;go('lesson');return}
 if(a==='goto'){st.p=+v;go('lesson');return}
 if(a==='next'){if(!S.pg[st.p]){S.pg[st.p]=1;touchDay();save();toast('+10 نقاط، '+CHEERS[Math.random()*CHEERS.length|0]);checkBadges()}if(st.p<PAGES.length-1){st.p++;go('lesson')}else startQuiz(QUIZ);return}
 if(a==='prev'){if(st.p){st.p--;go('lesson')}else go('index');return}
 if(a==='quiz'){startQuiz(QUIZ);return}
 if(a==='retry'){startQuiz(st.wrong);return}
 if(a==='pick'&&!st.pick){var it=st.qs[st.qi];st.pick=v;var ok=v===it[1];if(ok){st.score++;st.cheer=CHEERS[Math.random()*CHEERS.length|0]}else st.wrong.push(it);vQuiz();playSeq([ok?'qok':'qno','r'+QUIZ.indexOf(it)],null,(ok?'إجابة صحيحة. ':'ليست هذه. ')+it[2]);return}
 if(a==='qn'){if(st.qi+1<st.qs.length){st.qi++;st.pick=null;stop();vQuiz();window.scrollTo(0,0)}else{if(st.qs.length===QUIZ.length&&st.score>S.q){S.q=st.score}touchDay();save();checkBadges();go('result')}return}
 if(a==='fcreate'){var n1=(document.getElementById('fn').value||'').trim();if(!n1){toast('اكتب اسمك أولاً');return}S.name=n1;save();F={code:rid(20),me:rid(10)};ls('tj_f',F);fput('/tj/m/'+F.me,{name:n1,o:1}).then(function(){pushSoon();go('fam')}).catch(function(){toast('تعذّر الاتصال، حاول مرة أخرى');F={};ls('tj_f',F)});return}
 if(a==='fme'){F.me=v;ls('tj_f',F);var m=MEM.filter(function(x){return x.id===v})[0];if(m&&!S.name){S.name=m.name}save();pushSoon();toast('أهلاً '+(m?m.name:'')+'، بالتوفيق في التحدي!');go('fam');return}
 if(a==='fadd'){var n2=(document.getElementById('fn').value||'').trim();if(!n2){toast('اكتب اسمك أولاً');return}var id=rid(10);fput('/tj/m/'+id,{name:n2}).then(function(){F.me=id;ls('tj_f',F);S.name=n2;save();go('fam')}).catch(function(){toast('تعذّر الاتصال')});return}
 if(a==='fjoin'){var lv=(document.getElementById('fl').value||'').match(/[#&]k=([A-Za-z0-9_-]{8,64})/);if(!lv){toast('الرابط غير صحيح');return}F={code:lv[1]};ls('tj_f',F);go('fam');return}
 if(a==='fcopy'){try{navigator.clipboard.writeText(link()).then(function(){toast('نُسخ الرابط')})}catch(x){}return}
 if(a==='fz'){fz=Math.max(24,Math.min(48,fz+(+v)));S.fz=fz;save();document.documentElement.style.setProperty('--q',fz+'px');return}
 if(a==='snd'){snd=!snd;S.snd=snd;save();if(!snd)stop();b.textContent=snd?'مُشغّل':'متوقّف';return}
 if(a==='fleave'){F={};ls('tj_f',F);document.querySelector('.sheet').remove();go('fam');return}
 if(a==='sclose'){var sn=document.getElementById('sn');if(sn&&sn.value.trim()&&sn.value.trim()!==S.name){S.name=sn.value.trim();save()}document.querySelector('.sheet').remove();if(st.v!=='lesson'&&st.v!=='quiz')render();return}
});
document.addEventListener('click',function(e){if(e.target.classList&&e.target.classList.contains('sheet'))e.target.remove()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
